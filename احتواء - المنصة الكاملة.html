عمل</h1>\n  <div style=\"display:flex;alignItems:center;gap:10px;fontSize:13px;color:#6B667A;marginBottom:24px\">\n    <div style=\"width:28px;height:28px;borderRadius:50%;overflow:hidden\"><img src=\"https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?w=100&h=100&fit=crop&crop=faces&q=80&auto=format\" alt=\"د. سلمى العتيبي\" style=\"width:100%;height:100%;objectFit:cover;display:block\"/></div>\n    <span>د. سلمى العتيبي</span><span>· منذ 3 أيام · 6 دقائق قراءة</span>\n  </div>\n  <div data-article-hero=\"true\" style=\"height:380px;borderRadius:12px;overflow:hidden;marginBottom:28px\"><img src=\"https://images.unsplash.com/photo-1541199249251-f713e6145474?w=1200&h=800&fit=crop&q=80&auto=format\" alt=\"صورة المقال الرئيسية\" style=\"width:100%;height:100%;objectFit:cover;display:block\"/></div>\n  <p style=\"fontSize:16px;lineHeight:1.9;margin:0 0 20px\">نوبة القلق أثناء العمل غالباً ما تبدأ بإحساس مفاجئ بضيق التنفس أو تسارع القلب. أول خطوة عملية هي تسمية الشعور بصوت هادئ داخلي، ثم اللجوء إلى تنفس بطيء لعشر ثوانٍ.</p>\n  <div style=\"background:#F1EEF6;borderRadius:12px;padding:22px 26px;fontSize:19px;fontWeight:600;lineHeight:1.7;margin:0 0 20px\">\"القلق لا يُختفى بالمقاومة، بل بالتعرف عليه بهدوء.\"</div>\n  <p style=\"fontSize:16px;lineHeight:1.9;margin:0 0 32px\">إذا تكررت النوبات أكثر من مرتين أسبوعياً، فمن المفيد استشارة أخصائي لوضع خطة تعامل مخصصة تشمل تمارين يومية ومتابعة أسبوعية.</p>\n  <div style=\"display:flex;gap:8px;marginBottom:32px\"><span style=\"fontSize:12px;background:#F1EEF6;padding:4px 12px;borderRadius:999px\">قلق</span><span style=\"fontSize:12px;background:#F1EEF6;padding:4px 12px;borderRadius:999px\">العمل</span></div>\n  <div style=\"display:flex;gap:16px;alignItems:center;border:1px solid #E7E3ED;borderRadius:14px;padding:20px;marginBottom:40px\">\n    <div style=\"width:56px;height:56px;borderRadius:50%;overflow:hidden;flexShrink:0\"><img src=\"https://images.unsplash.com/photo-1573497019940-1c28c88b4f3e?w=140&h=140&fit=crop&cro  bg: \"#F1EEF6\", color: \"#1F1B29\" },\n        { label: \"نوم\", bg: \"#F1EEF6\", color: \"#1F1B29\" },\n        { label: \"ضغط عصبي\", bg: \"#F1EEF6\", color: \"#1F1B29\" },\n      ],\n      assessments: [\n        { icon: \"٭\", iconBg: \"#F4F0FC\", iconColor: \"#3A1078\", name: \"مقياس الضغط العصبي\", desc: \"يقيس مستوى الضغط النفسي اليومي وتأثيره على تركيزك ومزاجك.\", questions: 12, time: \"4 دقائق\" },\n        { icon: \"◐\", iconBg: \"#FFF4E5\", iconColor: \"#B85F00\", name: \"مقياس القلق\", desc: \"يساعدك على التعرف على شدة أعراض القلق التي تشعر بها مؤخراً.\", questions: 15, time: \"5 دقائق\" },\n        { icon: \"☾\", iconBg: \"#F1EEF6\", iconColor: \"#3A1078\", name: \"مقياس جودة النوم\", desc: \"يقيس جودة نومك وأثره على نشاطك خلال اليوم.\", questions: 10, time: \"3 دقائق\" },\n        { icon: \"♡\", iconBg: \"#FFF4E5\", iconColor: \"#B85F00\", name: \"مقياس تقدير الذات\", desc: \"يعكس نظرتك لذاتك وثقتك بقدراتك في الوقت الحالي.\", questions: 10, time: \"4 دقائق\" },\n        { icon: \"≈\", iconBg: \"#F4F0FC\", iconColor: \"#3A1078\", name: \"مقياس أعراض الاكتئاب\", desc: \"يرصد مؤشرات المزاج المنخفض والطاقة خلال الأسابيع الأخيرة.\", questions: 14, time: \"5 دقائق\" },\n        { icon: \"⚭\", iconBg: \"#F1EEF6\", iconColor: \"#3A1078\", name: \"مقياس جودة العلاقات\", desc: \"يقيّم مستوى الرضا والتواصل في علاقاتك القريبة.\", questions: 12, time: \"4 دقائق\" },\n      ],\n    };\n  }\n}\n<\/script>\n</body>\n</html>\n"},"AssessmentTake.dc.html":{"template":"<helmet>\n<link href=\"https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\"/>\n<script src=\"./image-slot.js\"><\/script>\n</helmet>\n<div dir=\"rtl\" style=\"fontFamily:'Cairo',sans-serif;background:#FAF9FB;color:#1F1B29;minHeight:100vh\">\n<dc-import name=\"Header\" hint-size=\"100%,64px\"></dc-import>\n\n<div style=\"maxWidth:720px;margin:0 auto;padding:32px 40px 100px\">\n  <div style=\"background:#F4F0FC;border:1px solid #E6DBF7;borderRadius:14px;padding:16px 20px;display:flex;gap:12px;alignItems:flex-start;marginBottom:28px\">\n    <span style=\"width:24px;height:24px;borderRadius:50%;background:#3A1078;color:#fff;display:flex;alignItems:center;justifyContent:center;fontSize:12px;fontWeight:800;flexShrink:0\">i</span>\n    <span style=\"fontSize:13px;fontWeight:700;color:#3A1078;lineHeight:1.7\">هذه الاختبارات أداة إرشادية أولية، ولا تُغني عن استشارة أخصائي مختص. النتيجة ليست تشخيصاً طبياً.</span>\n  </div>\n\n  <sc-if value=\"{{isQuestion}}\" hint-placeholder-val=\"{{true}}\">\n    <div style=\"marginBottom:24px\">\n      <div style=\"display:flex;justifyContent:space-between;fontSize:13px;color:#6B667A;marginBottom:8px\"><span>سؤال 3 من 15</span><span>مقياس القلق</span></div>\n      <div style=\"height:8px;background:#F1EEF6;borderRadius:999px;overflow:hidden\"><div style=\"width:20%;height:100%;background:#3A1078\"></div></div>\n    </div>\n    <h1 style=\"fontSize:20px;fontWeight:800;lineHeight:1.6;margin:0 0 24px\">خلال الأسبوعين الماضيين، كم مرة شعرت بصعوبة في التركيز بسبب القلق؟</h1>\n    <div style=\"display:flex;flexDirection:column;gap:10px;marginBottom:32px\">\n      <sc-for list=\"{{options}}\" as=\"o\" hint-placeholder-count=\"5\">\n        <label onClick=\"{{o.onClick}}\" style=\"display:flex;alignItems:center;gap:14px;border:1.5px solid {{o.border}};background:{{o.bg}};borderRadius:12px;padding:16px 20px;cursor:pointer\">\n          <input type=\"radio\" checked=\"{{o.checked}}\" name=\"q3\" style=\"width:18px;height:18px\" readOnly/>\n          <span style=\"fontSize:15px;fontWeight:600\">{{o.label}}</span>\n        </label>\n      </sc-for>\n    </div>\n    <div style=\"display:flex;justifyContent:space-between\">\n      <button onClick=\"{{goPrev}}\" style=\"background:transparent;color:#3A1078;padding:12px 28px;borderRadius:10px;border:1.5px solid #3A1078;fontWeight:700;fontSize:14px;fontFamily:Cairo\">السابق</button>\n      <button onClick=\"{{goNext}}\" style=\"background:#3A1078;color:#fff;padding:12px 32px;borderRadius:10px;border:none;fontWeight:700;fontSize:14px;fontFamily:Cairo\">التالي</button>\n    </div>\n  </sc-if>\n\n  <sc-if value=\"{{isResult}}\" hint-placeholder-val=\"{{false}}\">\n    <div style=\"textAlign:center;marginBottom:8px\">\n      <div style=\"fontSize:13px;color:#6B667A;marginBottom:8px\">نتيجة مقياس القلق</div>\n      <div style=\"display:inline-block;padding:8px 24px;borderRadius:999px;background:{{levelBg}};color:{{levelColor}};fontSize:16px;fontWeight:800;marginBottom:20px\">مستوى {{levelLabel}}</div>\n      <p style=\"fontSize:15px;lineHeight:1.9;color:#1F1B29;maxWidth:520px;margin:0 auto 24px\">{{levelDesc}}</p>\n    </div>\n    <div style=\"background:#F1EEF6;border:1px solid #E7E3ED;borderRadius:14px;padding:18px 22px;fontSize:14px;color:#3A1078;fontWeight:600;lineHeight:1.8;marginBottom:28px;textAlign:center\">هذه النتيجة إرشادية فقط ولا تمثل تشخيصاً. للحصول على تقييم دقيق، يُنصح بالتحدث مع أخصائي.</div>\n    <div style=\"display:flex;flexDirection:column;gap:12px;alignItems:center\">\n      <a href=\"Booking.dc.html\" style=\"background:#FF8A00;color:#fff;padding:15px 40px;borderRadius:10px;fontWeight:700;fontSize:15px;textDecoration:none\">احجز استشارة مع أخصائي</a>\n      <div style=\"display:flex;gap:16px\">\n        <div onClick=\"{{restart}}\" style=\"color:#3A1078;fontSize:13px;fontWeight:700;textDecoration:none;cursor:pointer\">أعد الاختبار</div>\n        <span style=\"color:#3A1078;fontSize:13px;fontWeight:700;cursor:pointer\">شارك النتيجة</span>\n      </div>\n    </div>\n  </sc-if>\n</div>\n\n<dc-import name=\"Footer\" hint-size=\"100%,300px\"></dc-import>\n</div>","script":"class Component extends DCLogic {\n  state = {\n    view: \"\",\n    selectedOptionIndex: 2\n  };\n  renderVals() {\n    const view = this.state.view || (this.props.view ?? \"سؤال\");\n    const isResult = view === \"نتيجة\";\n    const selectedOptionIndex = this.state.selectedOptionIndex;\n    const selectOption = (index) => this.setState({ selectedOptionIndex: index });\n    const goNext = () => this.setState({ view: \"نتيجة\" });\n    const goPrev = () => this.setState({ view: \"سؤال\" });\n    const restart = () => this.setState({ view: \"سؤال\", selectedOptionIndex: 2 });\n    const level = this.props.resultLevel ?? \"متوسط\";\n    const levels = {\n      \"منخفض\": { bg: \"#E7F6EE\", color: \"#166B44\", desc: \"أعراض القلق التي وصفتها محدودة حالياً. الاستمرار في عادات مثل النوم المنتظم والتنفس الواعي يساعد على المحافظة على هذا المستوى.\" },\n      \"متوسط\": { bg: \"#FBF1DF\", color: \"#82590A\", desc: \"تظهر إجاباتك مستوى متوسطاً من أعراض القلق قد يؤثر على تركيزك أحياناً. قد تستفيد من متابعة أخصائي لوضع خطة تعامل مناسبة.\" },\n      \"مرتفع\": { bg: \"#FCEAE9\", color: \"#A82520\", desc: \"تشير إجاباتك إلى مستوى مرتفع من أعراض القلق قد يستفيد من متابعة مختص في وقت قريب لفهم أسبابه ووضع خطة تعامل.\" },\n    };\n    const l = levels[level] ?? levels[\"متوسط\"];\n    const options = [\"أبداً\", \"نادراً\", \"أحياناً\", \"غالباً\", \"دائماً\"].map((label, i) => {\n      const active = selectedOptionIndex === i;\n      return {\n        label,\n        border: active ? \"#3A1078\" : \"#E7E3ED\",\n        bg: active ? \"#F4F0FC\" : \"#fff\",\n        checked: active,\n        onClick: () => selectOption(i)\n      };\n    });\n    return {\n      isQuestion: !isResult, isResult, options, levelLabel: level, levelBg: l.bg, levelColor: l.color, levelDesc: l.desc,\n      goNext, goPrev, restart\n    };\n  }\n}","full":"<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"./support.js\"><\/script>\n</head>\n<body>\n<x-dc>\n<helmet>\n<link href=\"https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\"/>\n<script src=\"./image-slot.js\"><\/script>\n</helmet>\n<div dir=\"rtl\" style=\"fontFamily:'Cairo',sans-serif;background:#FAF9FB;color:#1F1B29;minHeight:100v uot;:900},&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;سؤال&quot;,&quot;options&quot;:[&quot;سؤال&quot;,&quot;نتيجة&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;resultLevel&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;متوسط&quot;,&quot;options&quot;:[&quot;منخفض&quot;,&quot;متوسط&quot;,&quot;مرتفع&quot;],&quot;tsType&quot;:&quot;string&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    view: \"\",\n    selectedOptionIndex: 2\n  };\n  renderVals() {\n    const view = this.state.view || (this.props.view ?? \"سؤال\");\n    const isResult = view === \"نتيجة\";\n    const selectedOptionIndex = this.state.selectedOptionIndex;\n    const selectOption = (index) => this.setState({ selectedOptionIndex: index });\n    const goNext = () => this.setState({ view: \"نتيجة\" });\n    const goPrev = () => this.setState({ view: \"سؤال\" });\n    const restart = () => this.setState({ view: \"سؤال\", selectedOptionIndex: 2 });\n    const level = this.props.resultLevel ?? \"متوسط\";\n    const levels = {\n      \"منخفض\": { bg: \"#E7F6EE\", color: \"#166B44\", desc: \"أعراض القلق التي وصفتها محدودة حالياً. الاستمرار في عادات مثل النوم المنتظم والتنفس الواعي يساعد على المحافظة على هذا المستوى.\" },\n      \"متوسط\": { bg: \"#FBF1DF\", color: \"#82590A\", desc: \"تظهر إجاباتك مستوى متوسطاً من أعراض القلق قد يؤثر على تركيزك أحياناً. قد تستفيد من متابعة أخصائي لوضع خطة تعامل مناسبة.\" },\n      \"مرتفع\": { bg: \"#FCEAE9\", color: \"#A82520\", desc: \"تشير إجاباتك إلى مستوى مرتفع من أعراض القلق قد يستفيد من متابعة مختص في وقت قريب لفهم أسبابه ووضع خطة تعامل.\" },\n    };\n    const l = levels[level] ?? levels[\"متوسط\"];\n    const options = [\"أبداً\", \"نادراً\", \"أحياناً\", \"غالباً\", \"دائماً\"].map((label, i) => {\n      const active = selectedOptionIndex === i;\n      return {\n        label,\n        border: active ? \"#3A1078\" : \"#E7E3ED\",\n        bg: active ? \"#F4F0FC\" : \"#fff\",\n        checked: active,\n        onClick: () => selectOption(i)\n      };\n    });\n    return {\n      isQuestion: !isResult, isResult, options, levelLabel: level, levelBg: l.bg, levelColor: l.color, levelDesc: l.desc,\n      goNext, goPrev, restart\n    };\n  }\n}\n<\/script>\n</body>\n</html>\n"},"Booking.dc.html":{"template":"<helmet>\n<link href=\"https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\"/>\n<script src=\"./image-slot.js\"><\/script>\n<style>\n@media (max-width:900px){[data-booking-grid]{grid-template-columns:minmax(0,1fr) !important}}\n@media (max-width:640px){[data-booking-pad]{padding:20px 16px 100px !important}[data-slots-grid]{grid-template-columns:repeat(3,minmax(0,1fr)) !important}[data-booking-form]{grid-template-columns:minmax(0,1fr) !important}}\n</style>\n</helmet>\n<div dir=\"rtl\" style=\"fontFamily:'Cairo',sans-serif;background:#FAF9FB;color:#1F1B29;minHeight:100vh\">\n<dc-import name=\"Header\" hint-size=\"100%,64px\"></dc-import>\n\n<div data-booking-pad=\"true\" style=\"maxWidth:1440px;margin:0 auto;padding:32px 40px 100px\">\n  <div data-booking-grid=\"true\" style=\"display:grid;gridTemplateColumns:360px minmax(0,1fr);gap:48px\">\n    <div style=\"border:1px solid #E7E3ED;borderRadius:14px;padding:24px;height:fit-content\">\n      <div style=\"width:88px;height:88px;borderRadius:50%;overflow:hidden;marginBottom:14px\"><img src=\"https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=180&h=180&fit=crop&crop=faces&q=80&auto=format\" alt=\"د. فهد المطيري\" style=\"width:100%;height:100%;objectFit:cover;display:block\"/></div>\n      <div style=\"fontSize:20px;fontWeight:800\">د. فهد المطيري</div>\n      <div style=\"fontSize:14px;color:#6B667A;marginBottom:10px\">أخصائي علاقات وأسرة</div>\n      <div style=\"fontSize:14px;color:#B85F00;fontWeight:600;marginBottom:14px\">★★★★★ 4.9 (140 تقييم)</div>\n      <div style=\"display:flex;gap:6px;marginBottom:14px\"><span style=\"fontSize:12px;background:#F1EEF6;padding:4px 12px;borderRadius:999px\">عربي</span><span style=\"fontSize:12px;background:#F1EEF6;padding:4px 12px;borderRadius:999px\">English</span></div>\n      <div style=\"fontSize:13px;lineHeight:1.8;color:#6B667A;marginBottom:20px\">ماجستير علم نفس إكلينيكي، 10 سنوات خبرة في استشارات الأسرة والعلاقات.</div>\n      <div style=\"fontSize:22px;fontWeight:800;color:#B85F00;paddingTop:16px;borderTop:1px solid #E7E3ED\">600 ج.م / جلسة</div>\n    </div>\n    <div>\n      <div style=\"fontSize:14px;fontWeight:700;marginBottom:12px\">المنطقة الزمنية: GMT+3 · الرياض ▾</div>\n      <div style=\"fontSize:15px;fontWeight:700;marginBottom:12px\">اختر التاريخ</div>\n      <div style=\"display:flex;gap:10px;marginBottom:24px;overflowX:auto;paddingBottom:4px\">\n        <sc-for list=\"{{weekDays}}\" as=\"d\" hint-placeholder-count=\"7\">\n          <div onClick=\"{{d.onClick}}\" style=\"minWidth:64px;textAlign:center;padding:10px 6px;borderRadius:10px;background:{{d.bg}};color:{{d.color}};cursor:pointer\">\n            <div style=\"fontSize:11px\">{{d.label}}</div>\n            <div style=\"fontSize:15px;fontWeight:700\">{{d.date}}</div>\n          </div>\n        </sc-for>\n      </div>\n      <div style=\"fontSize:15px;fontWeight:700;marginBottom:12px\">اختر الوقت</div>\n      <sc-if value=\"{{hasSlots}}\" hint-placeholder-val=\"{{true}}\">\n        <div data-slots-grid=\"true\" style=\"display:grid;gridTemplateColumns:repeat(4,1fr);gap:10px;marginBottom:28px;maxWidth:520px\">\n          <sc-for list=\"{{timeSlots}}\" as=\"t\" hint-placeholder-count=\"8\">\n            <div onClick=\"{{t.onClick}}\" style=\"textAlign:center;padding:12px 6px;borderRadius:8px;fontSize:13px;border:1px solid {{t.borderColor}};background:{{t.bg}};color:{{t.color}};textDecoration:{{t.strike}};cursor:{{t.cursor}};fontWeight:{{t.weight}}\">{{t.time}}</div>\n          </sc-for>\n        </div>\n      </sc-if>\n      <sc-if value=\"{{noSlots}}\" hint-placeholder-val=\"{{false}}\">\n 1EEF6\", color: \"#B0AABF\", borderColor: \"#F1EEF6\", strike: \"line-through\", cursor: \"not-allowed\", weight: 400, onClick: () => {} };\n      if (isSelected) return { time: s.time, bg: \"#3A1078\", color: \"#fff\", borderColor: \"#3A1078\", strike: \"none\", cursor: \"pointer\", weight: 700, onClick: () => this.setState({ selectedSlot: s.time }) };\n      return { time: s.time, bg: \"#fff\", color: \"#1F1B29\", borderColor: \"#E7E3ED\", strike: \"none\", cursor: \"pointer\", weight: 500, onClick: () => this.setState({ selectedSlot: s.time }) };\n    });\n    const weekDays = [\n      { label: \"الأحد\", date: \"9\" }, { label: \"الاثنين\", date: \"10\" },\n      { label: \"الثلاثاء\", date: \"11\" }, { label: \"الأربعاء\", date: \"12\" },\n      { label: \"الخميس\", date: \"13\" }, { label: \"الجمعة\", date: \"14\" }, { label: \"السبت\", date: \"15\" },\n    ].map(d => {\n      const active = selectedDate === d.date;\n      return {\n        ...d,\n        active,\n        bg: active ? \"#3A1078\" : \"#F1EEF6\",\n        color: active ? \"#fff\" : \"#1F1B29\",\n        onClick: () => this.setState({ selectedDate: d.date })\n      };\n    });\n    return {\n      hasSlots: !empty, noSlots: empty, timeSlots,\n      weekDays,\n    };\n  }\n}\n<\/script>\n</body>\n</html>\n"},"Checkout.dc.html":{"template":"<helmet>\n<link href=\"https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap\" rel=\"stylesheet\"/>\n<script src=\"./image-slot.js\"><\/script>\n<style>\n@media (max-width:900px){[data-checkout-grid]{grid-template-columns:minmax(0,1fr) !important}}\n@media (max-width:640px){[data-checkout-pad]{padding:24px 16px 100px !important}[data-card-fields]{grid-template-columns:minmax(0,1fr) !important}[data-card-fields] input:first-child{grid-column:span 1 !important}}\n</style>\n</helmet>\n<div dir=\"rtl\" style=\"fontFamily:'Cairo',sans-serif;background:#FAF9FB;color:#1F1B29;minHeight:100vh\">\n<dc-import name=\"Header\" hint-size=\"100%, :20px;overflowX:auto;paddingBottom:8px\">\n    <sc-for list=\"{{specialists}}\" as=\"sp\" hint-placeholder-count=\"4\">\n      <div data-hover-card=\"true\" style=\"minWidth:220px;border:1px solid #E7E3ED;borderRadius:14px;padding:20px;background:#fff;textAlign:center\">\n        <div style=\"width:64px;height:64px;borderRadius:50%;overflow:hidden;margin:0 auto 12px\"><img src=\"{{sp.img}}\" alt=\"{{sp.name}}\" style=\"width:100%;height:100%;objectFit:cover;display:block\"/></div>\n        <div style=\"fontSize:14px;fontWeight:700;marginBottom:4px\">{{sp.name}}</div>\n        <div style=\"fontSize:12px;color:#6B667A;marginBottom:6px\">{{sp.specialty}}</div>\n        <div style=\"fontSize:12px;color:#B85F00;fontWeight:600\">★★★★★ {{sp.rating}}</div>\n      </div>\n    </sc-for>\n  </div>\n</div>\n\n<div data-home-section=\"true\" style=\"background:#fff;borderTop:1px solid #E7E3ED;borderBottom:1px solid #E7E3ED;padding:56px 40px\">\n  <div data-stats-grid=\"true\" style=\"maxWidth:1440px;margin:0 auto;display:grid;gridTemplateColumns:repeat(4,1fr);gap:24px;textAlign:center\">\n    <div><div style=\"fontSize:36px;fontWeight:800;color:#3A1078\">120+</div><div style=\"fontSize:13px;color:#6B667A;marginTop:6px\">أخصائي معتمد</div></div>\n    <div><div style=\"fontSize:36px;fontWeight:800;color:#3A1078\">40,000+</div><div style=\"fontSize:13px;color:#6B667A;marginTop:6px\">مستخدم</div></div>\n    <div><div style=\"fontSize:36px;fontWeight:800;color:#3A1078\">18,500+</div><div style=\"fontSize:13px;color:#6B667A;marginTop:6px\">جلسة ودورة مكتملة</div></div>\n    <div><div style=\"fontSize:36px;fontWeight:800;color:#3A1078\">4.8</div><div style=\"fontSize:13px;color:#6B667A;marginTop:6px\">متوسط التقييم</div></div>\n  </div>\n</div>\n\n<div data-home-section=\"true\" style=\"maxWidth:1440px;margin:0 auto;padding:40px 40px 0\">\n  <div style=\"fontSize:13px;color:#6B667A;fontWeight:700;marginBottom:16px\">شركاء وإعلانات</div>\n  <div data-small-ads-grid=\"true\" style=\"disp renderVals() {\n    const searchQuery = this.state.searchQuery;\n    const allSearchable = [\n      \"كيف ألغي حجز جلسة استشارية؟\",\n      \"متى يتم استرداد المبلغ بعد الإلغاء؟\",\n      \"كيف أغيّر موعد الجلسة؟\",\n      \"كيف أسترد قيمة دورة اشتريتها؟\",\n      \"هل يمكن تغيير الأخصائي بعد الحجز؟\",\n      \"كيف أحصل على شهادة إتمام الدورة؟\",\n      \"هل بياناتي في الجلسات الاستشارية سرية؟\",\n      \"ما هي طرق الدفع المتاحة؟\",\n      \"كيف أتابع طلبي من المتجر؟\"\n    ];\n    let searchResults = [];\n    let hasResults = false;\n    let noResults = false;\n    if (searchQuery.trim().length > 0) {\n      searchResults = allSearchable.filter(q => q.includes(searchQuery));\n      if (searchResults.length > 0) {\n        hasResults = true;\n      } else {\n        noResults = true;\n      }\n    }\n    const editorSearch = this.props.searchState ?? \"عادي\";\n    if (editorSearch === \"نتائج\" && !searchQuery) {\n      hasResults = true;\n      searchResults = [\"كيف ألغي حجز جلسة استشارية؟\", \"متى يتم استرداد المبلغ بعد الإلغاء؟\", \"كيف أغيّر موعد الجلسة؟\"];\n    } else if (editorSearch === \"لا نتائج\" && !searchQuery) {\n      noResults = true;\n    }\n    const onSearchInput = (e) => {\n      this.setState({ searchQuery: e.target.value });\n    };\n    return {\n      searchQuery,\n      hasResults, noResults,\n      searchResults,\n      onSearchInput,\n      categories: [\n        { icon: \"◐\", title: \"الحسابات وتسجيل الدخول\", count: 12 },\n        { icon: \"◆\", title: \"الدفع والفواتير والاسترداد\", count: 18 },\n        { icon: \"◷\", title: \"الحجوزات والجلسات\", count: 15 },\n        { icon: \"▣\", title: \"الدورات والشهادات\", count: 10 },\n        { icon: \"▢\", title: \"المتجر والطلبات\", count: 9 },\n        { icon: \"◈\", title: \"الخصوصية والأمان\", count: 7 },\n      ],\n      faqs: [\n        { q: \"كيف ألغي حجز جلسة استشارية؟\", a: \"من لوحة حسابك، افتح «حجوزاتي» واختر «إلغاء» بجانب الموعد، قبل 24 ساعة على الأقل لاسترداد كامل.\", open: true, sign: \"−\" },\n        { q: \"كيف أسترد قيمة دورة اشتريتها؟\", a: \"يمكن استرداد قيمة الدورة كاملة خلال 7 أيام من الشراء عبر تذكرة دعم أو من صفحة الفواتير.\", open: false, sign: \"+\" },\n        { q: \"هل يمكن تغيير الأخصائي بعد الحجز؟\", a: \"نعم، يمكنك إلغاء الموعد الحالي وإعادة الحجز مع أخصائي آخر دون رسوم إضافية.\", open: false, sign: \"+\" },\n        { q: \"كيف أحصل على شهادة إتمام الدورة؟\", a: \"تصدر الشهادة تلقائياً في صفحة الدورة بعد إكمال جميع الدروس والاختبار النهائي.\", open: false, sign: \"+\" },\n        { q: \"هل بياناتي في الجلسات الاستشارية سرية؟\", a: \"نعم، ملاحظات الجلسات لا تظهر إلا للأخصائي المعني والإدارة العليا فقط.\", open: false, sign: \"+\" },\n        { q: \"ما هي طرق الدفع المتاحة؟\", a: \"بطاقات الائتمان والمدى، Apple Pay، والتحويل البنكي.\", open: false, sign: \"+\" },\n        { q: \"كيف أتابع طلبي من المتجر؟\", a: \"من «حسابي ← فواتيري» يمكنك تتبع حالة الشحن لكل طلب.\", open: false, sign: \"+\" },\n      ],\n    };\n  }\n}\n<\/script>\n</body>\n</html>\n"}}</script>

<script>
  // Inline the image-slot.js content
  // @ds-adherence-ignore -- omelette starter scaffold (raw elements/hex/px by design)
// Copied omelette starter. Re-running copy_starter_component with this kind overwrites this file with the latest version (page content is unaffected).
/* BEGIN USAGE */
/**
 * <image-slot> — user-fillable image placeholder.
 *
 * Drop this into a deck, mockup, or page wherever a design needs an image.
 * You control the slot's shape; it sizes to its container by default. When the search_stock_photos tool
 * is available, prefill the slot by default — write the photo's URL into
 * src (with credit/credit-href); the user can still fill or replace it
 * by dragging an image file onto it (or clicking to browse). The dropped
 * image persists across reloads via a .image-slots.state.json sidecar —
 * same read-via-fetch / write-via-window.omelette pattern as
 * design_canvas.jsx, so the filled slot shows on share links, downloaded
 * zips, and PPTX export. Outside the omelette runtime the slot is read-only.
 *
 * The sidecar is a SIBLING of the HTML file that uses this component: the
 * read is a document-relative fetch, and the host resolves the bridge's
 * sidecar writes into the previewed file's directory to match (same
 * contract as design_canvas.jsx). Pages in the same directory share one
 * sidecar; keep slot ids distinct across them.
 *
 * Attributes:
 *   id           Persistence key. REQUIRED for the drop to survive reload —
 *                every slot on the page needs a distinct id.
 *   shape        'rect' | 'rounded' | 'circle' | 'pill'   (default 'rounded')
 *                'circle' applies 50% border-radius; on a non-square slot
 *                that's an ellipse — set equal width and height for a true
 *                circle.
 *   radius       Corner radius in px for 'rounded'.       (default 12)
 *   mask         Any CSS clip-path value. Overrides `shape` — use this for
 *                hexagons, blobs, arbitrary polygons.
 *   fit          Initial framing baseline: cover | contain.   (default 'cover')
 *                cover starts the image filling the frame (overflow cropped);
 *                contain starts it fully visible (letterboxed). Either way the
 *                user can always pan/scale from there — double-click, or the
 *                Edit control, enters reframe mode (drag to move, scroll or
 *                corner-handles to scale; Escape / click-out commits). The
 *                crop persists alongside the image in the sidecar.
 *   placeholder  Empty-state caption.                      (default 'Drop an image')
 *   src          Optional initial/fallback image URL. Prefill it with a real
 *                photo via search_stock_photos when that tool is available
 *                (set credit/credit-href from the result). A user drop
 *                overrides it; clearing the drop reveals src again.
 *   credit       Attribution text shown as a small overlay at the
 *                bottom-left of the filled slot. REQUIRED whenever src
 *                points at any Unsplash host (images.unsplash.com,
 *                plus.unsplash.com, …): an Unsplash src with no credit
 *                renders an error tile INSTEAD of the photo (Unsplash
 *                terms forbid showing their photos unattributed). Use the
 *                exact form 'Photo by {photographer name} on Unsplash' —
 *                the overlay then links the name to credit-href and
 *                'Unsplash' to the Unsplash homepage, and links back to
 *                unsplash.com automatically get the required utm referral
 *                params appended at render time. The credit belongs to
 *                the src image, so it only shows while src is what's
 *                displayed — a user-dropped image hides it.
 *   credit-href  Link for the photographer's name in the credit overlay
 *                (their Unsplash profile URL from the stock-photo search
 *                results). http(s) URLs only — anything else renders the
 *                name as plain text.
 *
 * Sizing: the slot fills its container by default (width/height 100%).
 * Put it in a sized wrapper — absolutely positioned, a grid cell, a fixed
 * frame — and it takes exactly that box. When the parent's height is
 * indefinite (ordinary flow), it falls back to full width at a 3:2 aspect
 * ratio instead of collapsing. In a shrink-to-fit parent (a float,
 * width:max-content, an unsized absolute wrapper), percentages have
 * nothing to resolve against — size the slot or its wrapper explicitly
 * there. For a fixed-size slot, set
 * width/height on the element itself (inline style), which overrides the
 * default. When
 * layering content above a slot (full-bleed layouts), make the overlay
 * click-through — pointer-events: none on scrims/text plates, re-enabled
 * on interactive children — so the slot's hover controls stay reachable.
 * Keep the slot's bottom-left corner visually clear as well: the credit
 * overlay renders there, and a dark fade or text plate covering it hides
 * the attribution Unsplash's terms require — end the fade above that
 * corner, or keep it nearly transparent where the credit sits.
 *
 * Usage:
 *   <div style="position:relative;width:100%;height:100%">      <!-- full-bleed: -->
 *     <image-slot id="bg" shape="rect"></image-slot>            <!-- fills the wrapper -->
 *   </div>
 *   <image-slot id="hero"   style="width:800px;height:450px" shape="rounded" radius="20"
 *               placeholder="Drop a hero image"></image-slot>
 *   <image-slot id="avatar" style="width:120px;height:120px" shape="circle"></image-slot>
 *   <image-slot id="kite"   style="width:300px;height:300px"
 *               mask="polygon(50% 0, 100% 50%, 50% 100%, 0 50%)"></image-slot>
 */
/* END USAGE */

(() => {
  const STATE_FILE = '.image-slots.state.json';

  // Unsplash terms require visible attribution wherever their photos
  // display, and every link back to unsplash.com must carry utm referral
  // params. Two render-time rules enforce that here:
  //  - an Unsplash-src slot with NO credit attribute renders an error
  //    tile INSTEAD of the photo (an uncredited Unsplash photo on screen
  //    is itself the terms violation, so it never renders bare);
  //  - rendered credit links pointing at unsplash.com get the referral
  //    params appended when absent (credit-href values live in page
  //    content that can't be edited after the fact).
  // Keep the utm_source value in sync with UTM_SOURCE in
  // platform/web-agent/unsplash.ts — this file is a project-local
  // artifact and cannot import it (equality is pinned by tests).
  const UNSPLASH_HOMEPAGE_HREF =
    'https://unsplash.com/?utm_source=claude_design&utm_medium=referral';
  // Host rule mirrors the hotlink validator that admits Unsplash srcs into
  // pages in the first place (cdn$ in unsplash.ts: apex or any subdomain)
  // — Unsplash+ results serve from plus.unsplash.com, not just images.*,
  // and an admitted-but-uncredited photo must error whatever unsplash
  // host it rides on.
  // Trailing-dot FQDNs (images.unsplash.com.) are the same host to the
  // browser but would miss the regex — strip one dot so the check fails
  // CLOSED (unrecognized-but-real Unsplash srcs must error, not render).
  const isUnsplashHost = (u) => {
    try {
      return /(^|\.)unsplash\.com$/.test(
        new URL(u, document.baseURI).hostname.replace(/\.$/, '')
      );
    } catch {
      return false;
    }
  };
  // Render-time referral normalization for links back to Unsplash:
  // appends utm_source/utm_medium when absent, preserves every existing
  // query param, never overwrites an existing utm_source, and passes
  // non-Unsplash URLs through untouched. Input is an ABSOLUTE validated
  // http(s) URL (the credit render funnel resolves + validates first).
  const withReferral = (href) => {
    try {
      const u = new URL(href);
      if (!/(^|\.)unsplash\.com$/.test(u.hostname.replace(/\.$/, ''))) {
        return href;
      }
      if (!u.searchParams.has('utm_source')) {
        u.searchParams.set('utm_source', 'claude_design');
      }
      if (!u.searchParams.has('utm_medium')) {
        u.searchParams.set('utm_medium', 'referral');
      }
      return u.toString();
    } catch (e) {
      return href;
    }
  };
  // 2× a ~600px slot in a 1920-wide deck — retina-sharp without making the
  // sidecar enormous. A 1200px WebP at q=0.85 is ~150-300KB.
  const MAX_DIM = 1200;
  // Raster formats only. SVG is excluded (can carry script; createImageBitmap
  // on SVG blobs is inconsistent). GIF is excluded because the canvas
  // re-encode keeps only the first frame, so an animated GIF would silently
  // go still — better to reject than surprise.
  const ACCEPT = ['image/png', 'image/jpeg', 'image/webp', 'image/avif'];

  // ── Shared sidecar store ────────────────────────────────────────────────
  // One fetch + immediate write-on-change for every <image-slot> on the
  // page. Reads via fetch() so viewing works anywhere the HTML and sidecar
  // are served together; writes go through window.omelette.writeFile, which
  // the host allowlists to *.state.json basenames only.
  const subs = new Set();
  let slots = {};
  // ids explicitly cleared before the sidecar fetch resolved — otherwise
  // the merge below can't tell "never set" from "just deleted" and would
  // resurrect the sidecar's stale value.
  const tombstones = new Set();
  let loaded = false;
  let loadP = null;

  function load() {
    if (loadP) return loadP;
    loadP = fetch(STATE_FILE)
      .then((r) => (r.ok ? r.json() : null))
      .then((j) => {
        // Merge: sidecar loses to any in-memory change that raced ahead of
        // the fetch (drop or clear) so neither is clobbered by hydration.
        if (j && typeof j === 'object') {
          const merged = Object.assign({}, j, slots);
          // A framing-only write that raced ahead of hydration must not
          // drop a user image that's only on disk — inherit u from the
          // sidecar for any in-memory entry that lacks one.
          for (const k in slots) {
            if (merged[k] && !merged[k].u && j[k]) {
              merged[k].u = typeof j[k] === 'string' ? j[k] : j[k].u;
            }
          }
          for (const id of tombstones) delete merged[id];
          slots = merged;
        }
        tombstones.clear();
      })
      .catch(() => {})
      .then(() => { loaded = true; subs.forEach((fn) => fn()); });
    return loadP;
  }

  // Serialize writes so two near-simultaneous drops on different slots
  // can't reorder at the backend and leave the sidecar with only the
  // first. A save requested mid-flight just marks dirty and re-fires on
  // completion with the then-current slots.
  let saving = false;
  let saveDirty = false;
  // Unload-time flush: save()'s serialization defers a mid-RTT re-fire to a
  // .then that never runs in an unloading document, silently dropping a
  // pagehide commit. Post the current slots immediately instead — content
  // is a superset snapshot of any in-flight save's, the write is a
  // whole-file last-writer-wins replace, and postMessage FIFO delivers it
  // to the host after the in-flight one, so a backend-side reorder at
  // worst reproduces the dropped-commit outcome this flush improves on.
  // Guarded on the initial sidecar read: pre-hydration slots can miss
  // other slots' persisted entries, and flushing it would clobber them —
  // that narrow case stays best-effort (the in-memory merge in load()
  // cannot happen in an unloading document anyway).
  function flushNow() {
    if (!loaded) return;
    const w = window.omelette && window.omelette.writeFile;
    if (!w) return;
    try { Promise.resolve(w(STATE_FILE, JSON.stringify(slots))).catch(() => {}); } catch (e) {}
  }
  function save() {
    if (saving) { saveDirty = true; return; }
    const w = window.omelette && window.omelette.writeFile;
    if (!w) return;
    saving = true;
    Promise.resolve(w(STATE_FILE, JSON.stringify(slots)))
      .catch(() => {})
      .then(() => { saving = false; if (saveDirty) { saveDirty = false; save(); } });
  }

  const S_MAX = 5;
  const clampS = (s) => Math.max(1, Math.min(S_MAX, s));

  // Normalize a stored slot value. Pre-reframe sidecars stored a bare
  // data-URL string; newer ones store {u, s, x, y}. Either shape is valid.
  function getSlot(id) {
    const v = slots[id];
    if (!v) return null;
    return typeof v === 'string' ? { u: v, s: 1, x: 0, y: 0 } : v;
  }

  function setSlot(id, val) {
    if (!id) return;
    if (val) { slots[id] = val; tombstones.delete(id); }
    else { delete slots[id]; if (!loaded) tombstones.add(id); }
    subs.forEach((fn) => fn());
    // A drop is rare + high-value — write immediately so nav-away can't lose
    // it. Gate on the initial read so we don't overwrite a sidecar we haven't
    // merged yet; the merge in load() keeps this change once the read lands.
    if (loaded) save(); else load().then(save);
  }

  // ── Image downscale ─────────────────────────────────────────────────────
  // Encode through a canvas so the sidecar carries resized bytes, not the
  // raw upload. Longest side is capped at 2× the slot's rendered width
  // (retina) and at MAX_DIM. WebP keeps alpha and is ~10× smaller than PNG
  // for photos, so there's no need for per-image format picking.
  async function toDataUrl(file, targetW) {
    const bitmap = await createImageBitmap(file);
    try {
      const cap = Math.min(MAX_DIM, Math.max(1, Math.round(targetW * 2)) || MAX_DIM);
      const scale = Math.min(1, cap / Math.max(bitmap.width, bitmap.height));
      const w = Math.max(1, Math.round(bitmap.width * scale));
      const h = Math.max(1, Math.round(bitmap.height * scale));
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(bitmap, 0, 0, w, h);
      return canvas.toDataURL('image/webp', 0.85);
    } finally {
      bitmap.close && bitmap.close();
    }
  }

  // ── Custom element ──────────────────────────────────────────────────────
  const stylesheet =
    // Fill the container by default: slots are usually placed inside a
    // sized wrapper (a hero frame, a grid cell, an inset:0 layer) and are
    // expected to take that box — a fixed intrinsic size would render as
    // a small tile in the corner of a full-bleed wrapper instead.
    // aspect-ratio is the companion fallback that keeps a bare slot
    // visible when the parent's height is indefinite: height:100%
    // resolves to auto there, and the ratio then derives height from
    // width instead of letting the slot collapse to zero height.
    // Explicit width/height on the element override all of this.
    // color:inherit (not a fixed near-black): the placeholder chrome —
    // empty-state icon/caption (currentColor) and the dashed ring — must
    // read on dark decks too, and the slide's own text color is the one
    // color guaranteed to contrast with the slide background. The soft
    // look comes from opacity on those parts, not from a baked-in alpha.
    ':host{display:block;position:relative;' +
    '  font:13px/1.3 system-ui,-apple-system,sans-serif;' +
    '  width:100%;height:100%;aspect-ratio:3/2}' +
    '.empty .cap,.empty .sub{opacity:.75}' +
    '.frame{position:absolute;inset:0;overflow:hidden;background:rgba(127,127,127,.08)}' +
    // .frame img (clipped) and .spill (unclipped ghost + handles) share the
    // same left/top/width/height in frame-%, computed by _applyView(), so the
    // inside-mask crop and the outside-mask spill stay pixel-aligned.
    '.frame img{position:absolute;max-width:none;transform:translate(-50%,-50%);' +
    '  -webkit-user-drag:none;user-select:none;touch-action:none}' +
    // Reframe mode (double-click): the full image spills past the mask. The
    // spill layer is sized to the IMAGE bounds so its corners are where the
    // resize handles belong. The ghost <img> inside is translucent; the real
    // clipped <img> underneath shows the opaque in-mask crop.
    // popover=manual promotes the spill to the top layer on reframe, so it is
    // not clipped by any overflow:hidden / clip-path / scroll-container
    // ancestor (a plain z-index can't escape overflow clipping). UA popover
    // defaults (inset:0;margin:auto) are reset; _applyView sets viewport px.
    '.spill{position:fixed;margin:0;inset:auto;border:0;padding:0;background:transparent;' +
    '  overflow:visible;transform:translate(-50%,-50%);z-index:1;cursor:grab;touch-action:none}' +
    ':host([data-panning]) .spill{cursor:grabbing}' +
    '.spill .ghost{position:absolute;inset:0;width:100%;height:100%;opacity:.35;' +
    '  pointer-events:none;-webkit-user-drag:none;user-select:none;' +
    '  box-shadow:0 0 0 1px rgba(0,0,0,.2),0 12px 32px rgba(0,0,0,.2)}' +
    '.spill .handle{position:absolute;width:12px;height:12px;border-radius:50%;' +
    '  background:#fff;box-shadow:0 0 0 1.5px #c96442,0 1px 3px rgba(0,0,0,.3);' +
    '  transform:translate(-50%,-50%)}' +
    '.spill .handle[data-c=nw]{left:0;top:0;cursor:nwse-resize}' +
    '.spill .handle[data-c=ne]{left:100%;top:0;cursor:nesw-resize}' +
    '.spill .handle[data-c=sw]{left:0;top:100%;cursor:nesw-resize}' +
    '.spill .handle[data-c=se]{left:100%;top:100%;cursor:nwse-resize}' +
    ':host([data-reframe]){z-index:10}' +
    ':host([data-reframe]) .frame{box-shadow:0 0 0 2px #c96442}' +
    '.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;' +
    '  justify-content:center;gap:6px;text-align:center;padding:12px;box-sizing:border-box;' +
    '  cursor:pointer;user-select:none}' +
    '.empty svg{opacity:.45}' +
    '.empty .cap{max-width:90%;font-weight:500;letter-spacing:.01em}' +
    '.empty .sub{font-size:11px}' +
    '.empty .sub u{text-underline-offset:2px}' +
    '.empty:hover .sub{opacity:1}' +
    ':host([data-over]) .frame{outline:2px solid #c96442;outline-offset:-2px;' +
    '  background:rgba(201,100,66,.10)}' +
    '.ring{position:absolute;inset:0;pointer-events:none;border:1.5px dashed currentColor;' +
    '  opacity:.35;transition:border-color .12s,opacity .12s}' +
    ':host([data-over]) .ring{border-color:#c96442;opacity:1}' +
    ':host([data-filled]) .ring{display:none}' +
    // Controls overlay INSIDE the frame, pinned to the top-right corner, so
    // a full-bleed slot in an overflow:hidden container still shows them
    // (the old below-mask placement got clipped). Credit sits bottom-left,
    // so top-right avoids collision. The blurred pill background keeps them
    // legible over the image.
    // The UA [popover] base rule styles the element in EVERY state (only
    // display:none is gated on :not(:popover-open), and the display:flex
    // below overrides that) — so the UA resets live HERE, like .spill's,
    // or the ordinary hover-state strip renders as a bordered Canvas box

    '.ctl{position:absolute;inset:auto;top:8px;right:8px;margin:0;border:0;padding:0;' +
    '  background:transparent;overflow:visible;' +
    '  display:flex;gap:6px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:2;' +
    '  white-space:nowrap}' +
    // While reframing, the spill owns the top layer and would swallow every
    // click on the in-frame controls. Promoting .ctl into the top layer
    // ABOVE the spill (shown after it — later popovers stack higher) keeps
    // Edit-as-toggle and Replace clickable mid-reframe. _applyView pins it
    // to the frame's top-right in viewport px (translateX(-100%)

    // base rule's top/right so the inline left/top position it alone.
    '.ctl:popover-open{position:fixed;inset:auto;transform:translateX(-100%)}' +
    ':host([data-filled][data-editable]:hover) .ctl,:host([data-reframe]) .ctl' +
    '  {opacity:1;pointer-events:auto}' +
    '.ctl button{appearance:none;border:0;border-radius:6px;padding:5px 10px;cursor:pointer;' +
    '  background:rgba(0,0,0,.65);color:#fff;font:11px/1 system-ui,-apple-system,sans-serif;' +
    '  backdrop-filter:blur(6px)}' +
    '.ctl button:hover{background:rgba(0,0,0,.8)}' +
    '.err{position:absolute;left:8px;bottom:8px;right:8px;color:#b3261e;font-size:11px;' +
    '  background:rgba(255,255,255,.85);padding:4px 6px;border-radius:5px;pointer-events:none}' +
    // Replacement in flight: after a src swap the browser keeps painting
    // the PREVIOUS image until the new one decodes, so a Replace would
    // flash the old photo and then pop. Hide the stale frame (visibility,
    // not display — _applyView geometry still applies) and spin until the
    // new image reports in (load/error clears data-swapping).
    ':host([data-swapping]) .frame img{visibility:hidden}' +
    '.loading{position:absolute;inset:0;display:none;align-items:center;' +
    '  justify-content:center;pointer-events:none}' +
    ':host([data-swapping]) .loading{display:flex}' +
    '.loading::after{content:"";width:22px;height:22px;border-radius:50%;' +
    '  border:2px solid rgba(127,127,127,.25);border-top-color:currentColor;' +
    '  animation:om-slot-spin .7s linear infinite}' +
    '@keyframes om-slot-spin{to{transform:rotate(360deg)}}' +
    // Reduced motion: the static two-tone ring still reads as "working".
    '@media (prefers-reduced-motion:reduce){.loading::after{animation:none}}' +
    '.credit{position:absolute;left:6px;bottom:6px;max-width:calc(100% - 12px);display:none;' +
    '  padding:3px 7px;border-radius:5px;background:rgba(0,0,0,.55);color:#fff;' +
    '  font:10px/1.2 system-ui,-apple-system,sans-serif;text-decoration:none;' +
    '  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;backdrop-filter:blur(6px)}' +
    // The credit is a SPAN holding one or two <a>s (Unsplash's prescribed
    // form links the photographer AND Unsplash) — anchors style inline so
    // the overlay reads as one line of text.
    '.credit a{color:inherit;text-decoration:none}' +
    '.credit a:hover,.credit a:focus-visible{text-decoration:underline}' +
    ':host([data-filled][data-credit]) .credit{display:block}' +
    // Exports must ship JUST the image — no hover controls, no credit chip
    // (the host marks <html data-om-exporting> for the capture window; the
    // page-level hide script can't reach shadow DOM, this rule can).
    ':host-context([data-om-exporting]) .ctl,' +
    ':host-context([data-om-exporting]) .credit{display:none !important}' +
    // Print must ship just the image too: the hover-gated controls can be
    // mid-hover when print() fires, and the credit chip is screen chrome —
    // the same rule the capture window gets, keyed on print media instead
    // of the host's data-om-exporting mark (the print path sets no mark).
    '@media print{.ctl,.credit{display:none !important}}' +
    // No export-window mask rules here on purpose: the export capture
    // releases the replacement mask by REMOVING data-swapping (the
    // shadow-root pass in pages/export/shared.ts HIDE_EXPORT_CHROME_SCRIPT)
    // — attribute removal works in every engine (:host-context is
    // Chromium-only), is scoped by construction to slots actually
    // mid-swap, and hides the spinner through the same gate. A masked img
    // would otherwise be silently dropped from PPTX decks (the capture
    // walk skips visibility:hidden imgs).
    // Attribution error tile: REPLACES the photo when an Unsplash src has
    // no credit attribute — rendering the photo uncredited is the terms
    // violation, so the photo must not appear at all.
    // Calm and neutral on purpose (review feedback): the tile informs the
    // user; the fix instructions are machine-facing (usage docblock, tool
    // description, and the turn-end scan's bounce copy name the attributes
    // for the agent).
    '.attr-error{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;' +
    '  justify-content:center;gap:6px;text-align:center;padding:12px;box-sizing:border-box;' +
    '  background:#f2f1ef;color:#6e6c66;user-select:none;' +
    '  font:13px/1.45 system-ui,-apple-system,sans-serif}' +
    '.attr-error svg{opacity:.55}' +
    '.attr-error .cap{max-width:92%;font-weight:500;letter-spacing:.01em}' +
    ':host([data-attribution-error]) .attr-error{display:flex}' +
    ':host([data-attribution-error]) .ring{display:none}';

  const icon =
    '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
    '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>' +
    '<path d="m21 15-5-5L5 21"/></svg>';

  const warnIcon =
    '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="m21.73 18-8-14a2 2 0 0 0-3.46 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/>' +
    '<path d="M12 9v4"/><path d="M12 17h.01"/></svg>';

  class ImageSlot extends HTMLElement {
    static get observedAttributes() {
      return ['shape', 'radius', 'mask', 'fit', 'placeholder', 'src', 'id', 'credit', 'credit-href'];
    }

    /** Duplicate-slide hook (called by deck-stage, see its
     *  _remintDuplicateIds): copy this id's stored image, if any, under a
     *  freshly minted key and return that key — so a duplicated slide's
     *  slot keeps its dropped photo instead of reverting to the
     *  placeholder. 'isFree' is the caller's uniqueness check (document
     *  ids); candidates must ALSO be unused in the sidecar, which can
     *  hold keys from other pages sharing the project root. (An EMPTY
     *  slot on another page leaves no sidecar entry, so its id is not
     *  detectable here — a minted key can collide with it and that slot
     *  would show this photo. Same blast radius as two pages reusing an
     *  id by hand, which the shared sidecar already permits.) Returns null
     *  when no id could be minted (caller strips the id, today's
     *  behavior). */
    static cloneSlot(fromId, isFree) {
      if (typeof fromId !== 'string' || !fromId) return null;
      // Pre-hydration the store can't veto candidates or source the copy
      // — degrade to the strip (today's behavior) rather than mint
      // against keys we can't see yet. Any rendered (= droppable) slot
      // means load() has already settled.
      if (!loaded) return null;
      const stem = fromId.replace(/-\d+$/, '') || fromId;
      for (let n = 2; n < 100; n++) {
        const toId = stem + '-' + n;
        if (toId === fromId) continue;
        if (slots[toId] !== undefined) {
          // Reuse a key holding this exact value (bytes AND crop) if no
          // live element here owns it — a duplicate op the host refused
          // after minting leaves such a key behind, and reusing keeps
          // refused retries from accumulating one orphaned copy per
          // attempt. Full equality (not just bytes) so a byte-identical
          // key another PAGE owns with its own crop is stepped past, not
          // adopted or rewritten. (Entries without .u never match.)
          const prev = getSlot(toId);
          const cur = getSlot(fromId);
          if (!(prev && cur && prev.u && prev.u === cur.u &&
                prev.s === cur.s && prev.x === cur.x && prev.y === cur.y &&
                (typeof isFree !== 'function' || isFree(toId)))) continue;
          return toId;
        }
        if (typeof isFree === 'function' && !isFree(toId)) continue;
        const v = getSlot(fromId);
        if (v) setSlot(toId, Object.assign({}, v));
        return toId;
      }
      return null;
    }

    constructor() {
      super();
      // clonable: rail thumbnails deep-clone slides and carry this shadow
      // along; reuse an already-cloned root so upgrade-after-clone works.
      // (Deliberately NOT serializable — a getHTML consumer would embed
      // multi-MB sidecar data-URLs into serialized page HTML.)
      const root = this.shadowRoot ||
        this.attachShadow({ mode: 'open', clonable: true });
      // .spill and .ctl sit OUTSIDE .frame so overflow:hidden + border-radius
      // on the frame (circle, pill, rounded) can't clip them.
      root.innerHTML =
        '<style>' + stylesheet + '</style>' +
        '<div class="frame" part="frame">' +
        '  <img part="image" alt="" draggable="false" style="display:none">' +
        '  <div class="empty" part="empty">' + icon +
        '    <div class="cap"></div>' +
        '    <div class="sub">or <u>browse files</u></div></div>' +
        '  <div class="attr-error" part="attribution-error">' + warnIcon +
        '    <div class="cap">This photo needs attribution</div></div>' +
        '  <div class="loading" part="loading"></div>' +
        '  <div class="ring" part="ring"></div>' +
        '</div>' +
        // Outside .frame, like .spill/.ctl — the frame's overflow:hidden +
        // border-radius/clip-path would cut the credit off on circle/pill/mask.
        // A SPAN, not an <a>: the prescribed Unsplash credit holds two links
        // (photographer + Unsplash), built per-render in _render().
        '<span class="credit" part="credit"></span>' +
        '<div class="spill" popover="manual" data-dc-edit-transparent>' +
        '  <img class="ghost" alt="" draggable="false">' +
        '  <div class="handle" data-c="nw"></div><div class="handle" data-c="ne"></div>' +
        '  <div class="handle" data-c="sw"></div><div class="handle" data-c="se"></div>' +
        '</div>' +
        // data-dc-edit-transparent: the DC editor's edit-mode picker lets
        // clicks through for chrome marked with it (EDIT_TRANSPARENT_SEL)
        // — without it, Replace/Edit clicks in Edit mode are swallowed by
        // element selection and the controls look dead.
        '<div class="ctl" popover="manual" data-dc-edit-transparent><button data-act="replace" title="Replace image">Replace</button>' +
        '  <button data-act="edit" title="Reframe image">Edit</button></div>' +
        '<input type="file" accept="' + ACCEPT.join(',') + '" hidden>';
      this._frame = root.querySelector('.frame');
      this._ring = root.querySelector('.ring');
      this._img = root.querySelector('.frame img');
      this._empty = root.querySelector('.empty');
      this._cap = root.querySelector('.cap');
      this._sub = root.querySelector('.sub');
      this._spill = root.querySelector('.spill');
      this._ctl = root.querySelector('.ctl');
      this._credit = root.querySelector('.credit');
      this._attrError = root.querySelector('.attr-error');
      // Credit clicks open the link, not browse/reframe.
      this._credit.addEventListener('click', (e) => e.stopPropagation());
      this._credit.addEventListener('dblclick', (e) => e.stopPropagation());
      this._ghost = root.querySelector('.ghost');
      this._err = null;
      this._input = root.querySelector('input');
      this._depth = 0;
      this._gen = 0;
      // Encode-in-flight marker (the owning _ingest generation): while set,
      // the same-src "nothing in flight" clear in _render must not fire —
      // the stored value still points at the OLD image until the encode
      // lands, so that clear would unmask the stale image mid-replace.
      this._swapGen = 0;
      // Render-owned swap in flight: set when _render assigns a new src,
      // cleared only by the img's own load/error (or the empty branch).
      // img.complete CANNOT stand in for this — setting src only QUEUES
      // the current-request swap (a microtask), so synchronously after an
      // assignment, complete still reports the OLD settled request. The
      // pick path does exactly that: the host sets src, credit, and
      // credit-href back-to-back in one task, and renders #2/#3 would
      // read the stale complete === true and drop the mask one render
      // after it was set.
      this._loadPending = false;
      // See _render's empty branch: a transient attribution-error wipe of a
      // showing image must make the follow-up render a replacement (spinner),
      // not a first fill (blank frame).
      this._hidShowing = false;
      this._view = { s: 1, x: 0, y: 0 };
      this._subFn = () => this._render();
      // Shadow-DOM listeners live with the shadow DOM — bound once here so

      this._empty.addEventListener('click', () => this._input.click());
      root.addEventListener('click', (e) => {
        const act = e.target && e.target.getAttribute && e.target.getAttribute('data-act');

          if (!this._reframes()) return;
          if (this.hasAttribute('data-reframe')) this._exitReframe(true);

        }
      });
